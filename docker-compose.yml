version: '3'

services:
  plex:
    image: linuxserver/plex
    container_name: plex
    ports:
      - "32400:32400"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - VERSION=docker
    volumes:
      - ./media:/media
      - ./config/plex:/config
    restart: unless-stopped
