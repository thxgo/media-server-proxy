version: '3'

networks:
  homeserver:
    driver: bridge
    
services:
  plex:
    image: linuxserver/plex
    container_name: plex
    networks:
      - homeserver
    ports:
      - "32400:32400"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - VERSION=docker
    volumes:
      - ./media:/media
      - ./config/plex:/config
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: nginx
    networks:
      - homeserver
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - plex
    restart: unless-stopped
